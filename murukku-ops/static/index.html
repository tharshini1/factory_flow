<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E3B2B"><title>FactoryFlow: From Order to Audit, All in One Flow</title><meta name="description" content="An Integrated Food Manufacturing and Business Management System">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--leaf:#0E3B2B;--leaf2:#165239;--rice:#F1F3EA;--paper:#FCFDF8;--ink:#17261F;--mute:#6A7A70;--line:#DDE3D6;--tur:#F4B400;--kum:#B8132D;--ok:#2A8554;--sh:0 1px 0 rgba(14,59,43,.06),0 8px 24px -14px rgba(14,59,43,.35)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--rice);color:var(--ink);font:15px/1.45 "Hanken Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;letter-spacing:-.02em}h1{font-size:30px;font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:16px;font-weight:700}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}:focus-visible{outline:3px solid var(--tur);outline-offset:2px}
#app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
nav{background:var(--leaf);color:#EAF2E4;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(rgba(244,180,0,.16) 1.4px,transparent 1.6px);background-size:18px 18px}
.brand{display:flex;gap:10px;align-items:center;font:800 20px "Bricolage Grotesque";padding:0 8px 18px}.brand svg{width:34px;height:34px}
nav button{background:none;color:#CFE0D1;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600}nav button.on{background:var(--tur);color:#241a00}nav button:hover:not(.on){background:rgba(255,255,255,.09)}
.who{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;color:#AFC8B6}.who b{display:block;color:#fff}.who button{padding:6px 0;font-size:13px;color:var(--tur)}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1100px;width:100%}
.sub{color:var(--mute);margin:4px 0 20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.btn{background:var(--leaf);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700}.btn.tur{background:var(--tur);color:#241a00}.btn.ghost{background:transparent;color:var(--leaf);border:1.5px solid var(--leaf)}.btn.red{background:var(--kum)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.45}
input,select{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-height:44px}input:focus,select:focus{border-color:var(--leaf)}label{font-size:13px;font-weight:600;color:var(--mute);display:block;margin-bottom:4px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:#E6ECDF;color:var(--leaf)}.chip.bad{background:#F8DDE0;color:var(--kum)}.chip.ok{background:#D9EFE1;color:#14623A}.chip.tur{background:#FCEFC2;color:#6B4D00}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.seg button{background:#fff;border:1.5px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:600}.seg button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12.5px;color:var(--mute);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}
.big{font:800 34px "Bricolage Grotesque";letter-spacing:-.03em}.mute{color:var(--mute)}.right{text-align:right}
.prod{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.prod:last-child{border:0}.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:44px;height:44px;border-radius:12px;background:var(--rice);font:700 22px sans-serif;border:1.5px solid var(--line)}.stepper input{width:74px;text-align:center;font-weight:700;font-size:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--leaf);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center;z-index:5;margin-left:230px}
.tl{display:flex;gap:0;margin:10px 0}.tl div{flex:1;font-size:11.5px;color:var(--mute);text-align:center;position:relative}.tl i{display:block;height:6px;background:var(--line);margin-bottom:5px}.tl .d i{background:var(--ok)}.tl .d{color:var(--ok);font-weight:700}
.rail{position:relative;height:10px;min-width:120px;background:#E8ECE2;border-radius:9px}.rail .band{position:absolute;left:35%;width:30%;top:0;bottom:0;background:#BFE0CC;border-radius:6px}.rail .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--leaf)}.rail .dot{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ok);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left .25s}.rail .dot.bad{background:var(--kum)}
.fill{height:8px;background:#E8ECE2;border-radius:6px;overflow:hidden}.fill i{display:block;height:100%;background:var(--ok)}.fill i.low{background:var(--kum)}
.warn{background:#FBE5E8;border:1.5px solid #E7A5AE;border-radius:14px;padding:12px 14px;margin:10px 0}.good{background:#E1F2E8;border-radius:14px;padding:10px 14px;margin:10px 0}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:20;transition:transform .3s;max-width:90vw}#toast.on{transform:translateX(-50%)}#toast.err{background:var(--kum)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--leaf) radial-gradient(rgba(244,180,0,.2) 1.5px,transparent 1.7px) 0 0/22px 22px}.login .card{max-width:420px;width:100%}.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.demo button{background:var(--rice);padding:6px 11px;border-radius:99px;font-size:13px;font-weight:600}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;top:auto;height:auto;flex-direction:row;z-index:6;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto;background:var(--leaf)}.brand,.who{display:none}nav button{flex:1;text-align:center;padding:9px 6px;font-size:12.5px;white-space:nowrap}.bar{margin:0 0 56px;padding-bottom:12px}main{padding-bottom:150px}}

#splash{position:fixed;inset:0;z-index:50;background:var(--leaf) radial-gradient(rgba(244,180,0,.18) 1.5px,transparent 1.7px) 0 0/22px 22px;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;animation:out .5s ease 2.5s forwards}
#splash svg{width:120px;height:120px;stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.5s ease .1s forwards}
#splash h1{font-size:clamp(40px,9vw,72px);margin:14px 0 6px;display:flex;justify-content:center}#splash h1 span{display:inline-block;opacity:0;transform:translateY(24px);animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}#splash h1 .f{color:var(--tur)}
#splash .tg{font:600 clamp(15px,3.6vw,20px) "Hanken Grotesk";color:var(--tur);opacity:0;animation:fade .6s ease 1.5s forwards}#splash .ds{max-width:440px;margin:10px auto 0;color:#AFC8B6;opacity:0;animation:fade .6s ease 1.9s forwards}
#splash .ln{height:3px;width:0;background:var(--tur);margin:22px auto 0;border-radius:3px;animation:ln 2.6s linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes up{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes ln{to{width:180px}}@keyframes out{to{opacity:0;visibility:hidden}}
@media print{nav,.noprint,.bar{display:none!important}#app{display:block}.card{box-shadow:none}}
@media(prefers-reduced-motion:reduce){#splash svg{animation-duration:.01s}#splash h1 span{animation-duration:.01s}}
</style></head><body><div id="toast"></div><div id="splash" aria-label="FactoryFlow"><div><svg viewBox="0 0 40 40" fill="none" stroke="#F4B400" stroke-width="2.2" stroke-linecap="round"><path d="M20 20c0-2 3-2 3 0s-5 4-6 0 6-8 10-3 0 12-8 12-12-9-8-16 14-8 18 0"/></svg>
<h1><span class="f" style="animation-delay:0.60s">F</span><span class="f" style="animation-delay:0.67s">a</span><span class="f" style="animation-delay:0.74s">c</span><span class="f" style="animation-delay:0.81s">t</span><span class="f" style="animation-delay:0.88s">o</span><span class="f" style="animation-delay:0.95s">r</span><span class="f" style="animation-delay:1.02s">y</span><span class="" style="animation-delay:1.09s">F</span><span class="" style="animation-delay:1.16s">l</span><span class="" style="animation-delay:1.23s">o</span><span class="" style="animation-delay:1.30s">w</span></h1><div class="tg">From Order to Audit, All in One Flow.</div><div class="ds">An Integrated Food Manufacturing and Business Management System</div><div class="ln"></div></div></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={token:localStorage.tok||'',user:null,tab:null,cart:{},cust:null,items:[],customers:[],rep:'sales',seg:'raw',dates:{from:'',to:''}};
const NAV={salesman:[['order','New order'],['orders','My orders'],['sales','My sales']],admin:[['dash','Today'],['orders','Orders'],['order','New order'],['money','Money'],['prod','Production'],['stock','Stock'],['reports','Reports']],
production:[['prod','Production'],['stock','Stock'],['dash','Today']],accountant:[['reports','Reports'],['stock','Stock'],['money','Money']],owner:[['dash','Today'],['stock','Stock'],['prod','Production'],['reports','Reports']]};
const spiral='<svg viewBox="0 0 40 40" fill="none" stroke="#F4B400" stroke-width="3" stroke-linecap="round"><path d="M20 20c0-2 3-2 3 0s-5 4-6 0 6-8 10-3 0 12-8 12-12-9-8-16 14-8 18 0"/></svg>';
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
async function api(p,body){const r=await fetch('/api'+p,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){if(r.status==401&&S.user)logout();throw new Error(j.error)}return j}
async function act(fn,msg){try{const r=await fn();if(msg)toast(msg);return r}catch(e){toast(e.message,1)}}
function logout(){localStorage.removeItem('tok');S.token='';S.user=null;boot()}
const NET=/fetch|network|load/i;
async function boot(){if(S.token){try{S.user=await api('/me');localStorage.me=JSON.stringify(S.user)}catch(e){if(NET.test(e.message)&&localStorage.me)S.user=JSON.parse(localStorage.me);else S.token=''}}if(!S.user)return loginView();
 try{[S.items,S.customers]=await Promise.all([api('/items'),api('/customers')]);localStorage.cat=JSON.stringify([S.items,S.customers])}catch(e){if(!localStorage.cat)return toast(e.message,1);[S.items,S.customers]=JSON.parse(localStorage.cat)}
 S.tab=S.tab||NAV[S.user.role][0][0];flush();draw()}
function loginView(){$('#root').innerHTML=`<div class="login"><div class="card"><div class="brand" style="color:var(--leaf)">${spiral.replace('#F4B400','#0E3B2B')}FactoryFlow</div><h1>From Order to Audit, All in One Flow.</h1><p class="sub">An Integrated Food Manufacturing and Business Management System</p>
<label>Username</label><input id="u" autocomplete="username"><div style="height:10px"></div><label>Password</label><input id="p" type="password" autocomplete="current-password"><div style="height:14px"></div><button class="btn" style="width:100%" onclick="login()">Sign in</button>
<div class="demo">${[['sales_a','Salesman A'],['sales_b','Salesman B'],['admin','Admin'],['production','Production'],['auditor','Auditor'],['owner','Owner']].map(([u,n])=>`<button onclick="u.value='${u}';p.value='demo123';login()">${n}</button>`).join('')}</div></div></div>`;$('#p').onkeydown=e=>e.key=='Enter'&&login()}
async function login(){try{const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const j=await r.json();if(!r.ok)throw Error(j.error);S.token=j.token;localStorage.tok=j.token;S.user=j.user;S.tab=null;boot()}catch(e){toast(e.message,1)}}
function go(t){S.tab=t;draw()}
async function draw(){const u=S.user;$('#root').innerHTML=`<div id="app"><nav><div class="brand">${spiral}FactoryFlow</div>${NAV[u.role].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}<div class="who"><b>${esc(u.name)}</b>${u.role}<br><button onclick="logout()">Sign out</button></div></nav><main id="v"></main></div>`;
 try{try{S.items=await api('/items');localStorage.cat=JSON.stringify([S.items,S.customers])}catch(e){if(!NET.test(e.message))throw e}await V[S.tab]()}catch(e){toast(NET.test(e.message)?'You are offline. Only new orders work right now.':e.message,1)}}
const v=h=>$('#v').innerHTML=h;
// ---------- offline queue ----------
const Q=()=>JSON.parse(localStorage.q||'[]');
async function flush(){let q=Q();if(!q.length||!S.user)return;const rest=[];for(const o of q){try{await api('/orders',o)}catch(e){if(!NET.test(e.message)){toast('An offline order was rejected: '+e.message,1);continue}rest.push(o)}}localStorage.q=JSON.stringify(rest);if(q.length>rest.length)toast(`${q.length-rest.length} offline order(s) sent`)}
addEventListener('online',()=>flush().then(draw));addEventListener('offline',()=>S.tab=='order'&&draw());if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
// ---------- views ----------
const fg=()=>S.items.filter(i=>i.kind=='fg');
function cartCount(){return fg().filter(i=>+S.cart[i.id]>0).length}
function plist(){const q=(S.q||'').toLowerCase(),L=fg().filter(i=>i.name.toLowerCase().includes(q));return L.length?L.map(i=>`<div class="prod"><div class="grow"><b>${esc(i.name)}</b><div class="mute">${inr(i.price)} per ${i.unit.replace(/s$/,'')} · ${i.stock} ${i.unit} ready</div></div><div class="stepper"><button onclick="step(${i.id},-10)" aria-label="minus 10">−</button><input inputmode="numeric" id="c${i.id}" value="${S.cart[i.id]||''}" placeholder="0" oninput="S.cart[${i.id}]=this.value;sum()"><button onclick="step(${i.id},10)" aria-label="plus 10">+</button></div></div>`).join(''):'No product matches.'}
function cartTotal(){return fg().reduce((s,i)=>s+(+S.cart[i.id]||0)*i.price,0)}
const V={
async order(){const q=Q().length;
 v(`<h1>New order</h1><p class="sub">Pick a customer, tap quantities, send. Works without network too.</p>${navigator.onLine?'':'<div class="warn"><b>You are offline.</b> Orders are saved on this phone and sent automatically when the network returns.</div>'}${q?`<div class="warn">${q} order(s) saved on this phone, waiting for network. <button class="btn sm ghost" onclick="flush().then(draw)">Try now</button></div>`:''}
 <div class="card"><h3>Customer</h3><div class="seg" style="margin:10px 0 0">${S.customers.map(c=>`<button class="${S.cust==c.id?'on':''}" onclick="S.cust=${c.id};draw()">${esc(c.name)} <small>${c.state}</small></button>`).join('')}</div></div>
 <div class="card"><div class="row"><h3 class="grow">Products</h3><input style="max-width:190px" placeholder="Search products" value="${esc(S.q||'')}" oninput="S.q=this.value;$('#plist').innerHTML=plist()"></div><div id="plist">${plist()}</div></div>
 <div class="bar"><div class="grow"><div class="mute" style="color:#9DC4AA"><span id="cnt">${cartCount()}</span> product(s) · before GST</div><b id="tot" style="font-size:20px">${inr(cartTotal())}</b></div><button class="btn tur" onclick="send()">Send order</button></div>`)},
async orders(){const O=await api('/orders');v(`<h1>${S.user.role=='admin'?'Order desk':'My orders'}</h1><p class="sub">Newest first. Stock is checked live before you approve.</p>${O.length?O.map(orderCard).join(''):'<div class="card">No orders yet. Orders from salesmen land here the moment they send.</div>'}`)},
async sales(){const R=await api('/mysales');v(`<h1>My sales</h1><p class="sub">Customer-wise, before GST.</p><div class="card">${R.length?`<table><tr><th>Customer</th><th class="n">Orders</th><th class="n">Value</th></tr>${R.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.orders}</td><td class="n">${inr(r.amount)}</td></tr>`).join('')}</table>`:'Send your first order to see sales here.'}</div>`)},
async dash(){const d=await api('/dashboard'),r=d.last_run;
 v(`<h1>Today at the factory</h1><p class="sub">Orders, stock and variance in one glance.</p><div class="grid"><div class="card"><div class="mute">Orders today</div><div class="big">${d.orders_today}</div><span class="chip tur">${d.pending} waiting for approval</span></div>
 <div class="card"><div class="mute">Sales this month (incl. GST)</div><div class="big">${inr(d.sales_month)}</div></div><div class="card"><div class="mute">Outstanding dues</div><div class="big">${inr(d.outstanding)}</div>${d.dues.map(x=>`<div class="row"><span class="grow">${esc(x.name)}</span><b>${inr(x.due)}</b></div>`).join('')}</div>
 <div class="card"><div class="mute">Cost per packet · latest run</div><div class="big">${r?inr(r.cpp):'–'}</div>${r?`<span class="chip ${r.margin>0?'ok':'bad'}">${(r.margin_pct).toFixed(0)}% margin on ${inr(r.margin+r.cpp)}</span>`:''}</div></div>
 <div class="card"><h2>Variance alerts</h2>${d.alerts.length?d.alerts.map(a=>`<div class="warn" style="margin:8px 0">${esc(a)}</div>`).join(''):'<div class="good">Every run is inside tolerance.</div>'}</div>
 <div class="card"><h2>Stock levels</h2>${stockRows(d.stock)}</div>`)},
async stock(){const seg={raw:'Raw materials',pack:'Packaging',fg:'Finished goods'};
 v(`<h1>Stock</h1><p class="sub">Every balance is the sum of its ledger. Tap an item to see each movement and its source.</p><div class="seg">${Object.entries(seg).map(([k,l])=>`<button class="${S.seg==k?'on':''}" onclick="S.seg='${k}';draw()">${l}</button>`).join('')}</div><div class="card">${stockRows(S.items.filter(i=>i.kind==S.seg),1)}</div><div id="led"></div>`)},
async money(){const I=await api('/invoices'),adm=S.user.role=='admin',open=I.filter(i=>i.due>0),b=[0,0,0];open.forEach(i=>b[i.age<=30?0:i.age<=60?1:2]+=i.due);
 v(`<h1>Money</h1><p class="sub">Invoices, collections and what customers still owe.</p><div class="grid">${['0–30 days','31–60 days','61+ days'].map((l,k)=>`<div class="card"><div class="mute">${l}</div><div class="big">${inr(b[k])}</div></div>`).join('')}</div>
 ${adm&&open.length?`<div class="card"><h2>Record a payment</h2><div class="row" style="margin-top:10px"><div class="grow"><label>Invoice</label><select id="pi">${open.map(i=>`<option value="${i.id}">${i.no} · ${esc(i.cname)} · due ${inr(i.due)}</option>`).join('')}</select></div><div><label>Amount ₹</label><input id="pa" inputmode="decimal"></div><div><label>Mode</label><select id="pm"><option>UPI</option><option>Cash</option><option>Bank</option><option>Cheque</option></select></div><button class="btn" onclick="payNow()">Save payment</button></div></div>`:''}
 <div class="card scroll"><table><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Due</th><th></th></tr>${I.map(i=>`<tr><td>${i.no}</td><td>${esc(i.cname)}</td><td>${i.date}</td><td class="n">${inr(i.total)}</td><td class="n">${inr(i.paid)}</td><td class="n"><b>${inr(i.due)}</b></td><td><a href="/api/invoices/${i.id}/pdf?token=${S.token}" target="_blank">PDF</a></td></tr>`).join('')||'<tr><td colspan=7>No invoices yet.</td></tr>'}</table></div>`)},
async prod(){const R=await api('/runs'),can=['admin','production'].includes(S.user.role),prods=fg().filter(i=>i.bom&&i.bom.length),p=prods.find(i=>i.id==S.runProd)||prods[0],raw=S.items.filter(i=>i.kind!='fg');
 v(`<h1>Production</h1><p class="sub">Issue materials against the recipe. Variance shows as you type.</p>${can?`
 <div class="card"><h2>Receive raw material</h2><div class="row" style="margin-top:10px"><div class="grow"><label>Material</label><select id="mi">${raw.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.unit})</option>`).join('')}</select></div><div><label>Quantity</label><input id="mq" inputmode="decimal"></div><div><label>Rate ₹ per unit</label><input id="mr" inputmode="decimal"></div><div class="grow"><label>Supplier</label><input id="ms" placeholder="Supplier name"></div><button class="btn" onclick="buy()">Add to stock</button></div></div>
 <div class="card"><div class="row"><h2 class="grow">Log a production run</h2><select style="width:auto" onchange="S.runProd=+this.value;draw()">${prods.map(i=>`<option value="${i.id}" ${i.id==p.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div><p class="mute">One batch standard: ${p.yield} packets. Enter what was really issued.</p>
 <table><tr><th>Ingredient</th><th class="n">Standard</th><th style="width:130px">Actually used</th><th style="min-width:150px">Against tolerance ±3%</th></tr>${p.bom.map(b=>`<tr><td>${esc(b.name)}</td><td class="n">${disp(b.qty,b.factor)} ${b.unit}</td><td>${b.role=='pouch'?`<b id="pouch">${disp(b.qty,1)}</b> <span class="mute">good + damaged</span>`:`<input class="ri" data-i="${b.item_id}" data-p="${b.qty/b.factor}" value="${b.qty/b.factor}" inputmode="decimal" oninput="rv()">`}</td><td><div class="row"><div class="grow rl" data-i="${b.item_id}"></div><b class="rp" style="width:52px"></b></div></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:14px"><div><label>Good packets</label><input id="rg" value="${p.yield}" inputmode="numeric" oninput="rv()"></div><div><label>Damaged pouches</label><input id="rd" value="0" inputmode="numeric" oninput="rv()"></div><div class="grow"><label>Yield against ${p.yield} expected</label><div class="row"><div class="grow" id="ry"></div><b id="ryp" style="width:56px"></b></div></div><button class="btn tur" onclick="runNow(${p.id},${p.yield})">Save run</button></div></div>`:''}
 <h2 style="margin:20px 0 10px">Run history</h2>${R.map(runCard).join('')||'<div class="card">No runs yet.</div>'}`);if(can)rv()},
async reports(){const L=[['sales','Sales register'],['customerwise','By customer'],['productwise','By product'],['gst','GST summary'],['purchases','Purchases'],['stock','Stock summary'],['ledger','Stock ledger'],['production','Production variance'],['outstanding','Outstanding'],['payments','Collections'],['audit','Audit trail']];
 v(`<h1>Reports</h1><p class="sub">Filter by date, then export for the auditor.</p><div class="seg noprint">${L.map(([k,l])=>`<button class="${S.rep==k?'on':''}" onclick="S.rep='${k}';draw()">${l}</button>`).join('')}</div>
 <div class="row noprint" style="margin-bottom:12px"><div><label>From</label><input type="date" value="${S.dates.from}" onchange="S.dates.from=this.value;draw()"></div><div><label>To</label><input type="date" value="${S.dates.to}" onchange="S.dates.to=this.value;draw()"></div><div style="flex:1"></div><button class="btn ghost" onclick="dl()">Export CSV</button><button class="btn" onclick="print()">Save as PDF</button></div><div class="card scroll" id="rep">Loading…</div>`);
 const r=await api(`/report/${S.rep}?from=${S.dates.from}&to=${S.dates.to}`);$('#rep').innerHTML=`<h2 style="margin-bottom:10px">${L.find(x=>x[0]==S.rep)[1]}</h2><table><tr>${r.columns.map(c=>`<th>${c}</th>`).join('')}</tr>${r.rows.map(x=>`<tr>${x.map(c=>`<td class="${/^-?[\d,.]+$/.test(c)?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${r.columns.length}>No records in this period.</td></tr>`}</table>`}};
const disp=(q,f)=>+(q/f).toFixed(3);
function stockRows(L,click){return L.map(i=>{const cap=Math.max(i.reorder_disp*3,+i.stock,1);return `<div class="prod" ${click?`style="cursor:pointer" onclick="ledger(${i.id})"`:''}><div style="width:190px"><b>${esc(i.name)}</b>${i.low?' <span class="chip bad">Low</span>':''}</div><div class="grow"><div class="fill"><i class="${i.low?'low':''}" style="width:${Math.min(100,+i.stock/cap*100)}%"></i></div></div><div class="right" style="width:130px"><b>${i.stock} ${i.unit}</b><div class="mute">${inr(i.value)}</div></div></div>`}).join('')}
async function ledger(id){const L=await api('/ledger?item='+id);$('#led').innerHTML=`<div class="card scroll"><h2 style="margin-bottom:8px">Movements · ${esc(S.items.find(i=>i.id==id).name)}</h2><table><tr><th>When</th><th>Source document</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th><th>Batch</th></tr>${L.map(r=>`<tr><td>${r.ts}</td><td>${r.doc_type} #${r.doc_id}<div class="mute">${esc(r.note)}</div></td><td class="n">${r.in}</td><td class="n">${r.out}</td><td class="n"><b>${r.balance}</b></td><td>${r.batch}</td></tr>`).join('')}</table></div>`;$('#led').scrollIntoView({behavior:'smooth'})}
function step(id,d){const el=$('#c'+id);el.value=Math.max(0,(+el.value||0)+d);S.cart[id]=el.value;sum()}
function sum(){$('#tot').textContent=inr(cartTotal());$('#cnt').textContent=cartCount()}
async function send(){const lines=fg().filter(i=>+S.cart[i.id]>0).map(i=>({item_id:i.id,qty:+S.cart[i.id]}));if(!S.cust||!lines.length)return toast('Pick a customer and add a quantity.',1);
 const o={client_id:crypto.randomUUID?.()||String(Date.now()),customer_id:S.cust,lines,ts:new Date().toISOString().slice(0,19).replace('T',' ')};
 try{await api('/orders',o);toast('Order sent to the factory');}catch(e){if(NET.test(e.message)||!navigator.onLine){localStorage.q=JSON.stringify([...Q(),o]);toast('No network. Saved on this phone, will send automatically.')}else return toast(e.message,1)}
 S.cart={};S.cust=null;go('orders')}
function orderCard(o){const st=['submitted','approved','invoiced','dispatched'],at=st.indexOf(o.status),adm=S.user.role=='admin',open=['submitted','approved'].includes(o.status),inter=o.customer.state!='Tamil Nadu';
 return `<div class="card"><div class="row"><div class="grow"><h3>${o.no} · ${esc(o.customer.name)}</h3><div class="mute">${o.ts.slice(0,16)} · ${esc(o.salesman)} · ${o.customer.state} <span class="chip tur">${inter?'IGST':'CGST + SGST'}</span></div></div><span class="chip ${o.status=='rejected'?'bad':o.status=='dispatched'?'ok':''}">${o.status}</span></div>
 ${o.status=='rejected'?'':`<div class="tl">${st.map((s,k)=>`<div class="${k<=at?'d':''}"><i></i>${s}</div>`).join('')}</div>`}
 <table><tr><th>Product</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th>${adm?'<th>Stock check</th>':''}</tr>${o.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${adm&&open?`<input style="width:80px" id="q${l.id}" value="${l.qty_disp}">`:l.qty_disp}</td><td class="n">${adm&&open?`<input style="width:90px" id="p${l.id}" value="${l.price/100}">`:inr(l.price)}</td><td class="n">${inr(l.amount)}</td>${adm?`<td>${l.short?`<span class="chip bad">Short ${l.short_disp}</span> <span class="mute">${l.stock} in stock</span>`:`<span class="chip ok">Covered · ${l.stock} in stock</span>`}</td>`:''}</tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><b class="grow">Taxable ${inr(o.total)}${o.invoice?` · Invoice ${o.invoice.no} · total ${inr(o.invoice.total)}`:''}</b>
 ${adm?`${o.status=='submitted'||o.status=='approved'?`<button class="btn ghost sm" onclick="oa(${o.id},'edit',${JSON.stringify(o.lines.map(l=>l.id))})">Save edits</button>`:''}
 ${o.status=='submitted'&&!o.short?`<button class="btn sm" onclick="oa(${o.id},'approve')">Approve</button>`:''}${open?`<button class="btn red sm" onclick="oa(${o.id},'reject')">Reject</button>`:''}
 ${o.status=='approved'?`<button class="btn tur sm" onclick="oa(${o.id},'invoice')">Raise GST invoice</button>`:''}${o.status=='invoiced'?`<button class="btn sm" onclick="oa(${o.id},'dispatch')">Dispatch</button><button class="btn red sm" onclick="cn(${o.invoice.id})">Cancel with credit note</button>`:''}`:''}
 ${o.invoice?`<a class="btn ghost sm" style="text-decoration:none" target="_blank" href="/api/invoices/${o.invoice.id}/pdf?token=${S.token}">PDF</a><a class="btn ghost sm" style="text-decoration:none" target="_blank" href="https://wa.me/91${o.customer.phone}?text=${encodeURIComponent('Invoice '+o.invoice.no+' for '+inr(o.invoice.total)+': '+location.origin+'/api/invoices/'+o.invoice.id+'/pdf?token='+S.token)}">WhatsApp</a>`:''}</div>
 ${adm&&o.short&&o.status=='submitted'?`<div class="warn"><b>Not enough stock.</b> ${o.lines.filter(l=>l.short).map(l=>`Short by ${l.short_disp} ${l.unit}; ${l.stock} ready${l.batches_needed?`; ${l.batches_needed} more batch(es) would cover it`:''}.`).join(' ')}<div class="row" style="margin-top:8px"><button class="btn sm" onclick="trim(${o.id},${JSON.stringify(o.lines.map(l=>[l.id,l.avail]))})">Ship what we have</button><button class="btn ghost sm" onclick="oa(${o.id},'approve',{force:1})">Approve as backorder</button><button class="btn ghost sm" onclick="go('prod')">Plan production</button></div></div>`:''}</div>`}
async function oa(id,a,ids){let b={};if(a=='edit'){b={lines:ids.map(i=>({id:i,qty:$('#q'+i).value,price:$('#p'+i).value}))}}else if(ids&&ids.force)b=ids;const r=await act(()=>api(`/orders/${id}/${a}`,b),a=='approve'?'Approved':a=='edit'?'Order updated':a=='invoice'?'GST invoice raised':a=='dispatch'?'Dispatched. Stock updated':'Done');if(r)draw()}
async function trim(id,l){const r=await act(()=>api(`/orders/${id}/edit`,{lines:l.map(([i,a])=>({id:i,qty:a,price:$('#p'+i).value}))}),'Quantity reduced to available stock');if(r)draw()}
async function cn(id){if(!confirm('Cancel this invoice with a credit note? Stock is returned.'))return;const r=await act(()=>api(`/invoices/${id}/cancel`,{}),'Credit note issued');if(r)draw()}
async function payNow(){const r=await act(()=>api('/payments',{invoice_id:+$('#pi').value,amount:$('#pa').value,mode:$('#pm').value}),'Payment recorded');if(r)draw()}
async function buy(){const r=await act(()=>api('/purchases',{item_id:+$('#mi').value,qty:$('#mq').value,rate:$('#mr').value,supplier:$('#ms').value}),'Stock received');if(r)draw()}
const rail=p=>{const c=Math.max(-10,Math.min(10,p));return `<div class="rail"><i class="band"></i><i class="mid"></i><b class="dot ${Math.abs(p)>3?'bad':''}" style="left:${50+c*5}%"></b></div>`}
function rv(){const g=+$('#rg').value||0,d=+$('#rd').value||0;if($('#pouch'))$('#pouch').textContent=g+d;
 document.querySelectorAll('.ri').forEach(el=>{const p=+el.dataset.p,pc=p?((+el.value-p)/p*100):0,row=el.closest('tr');row.querySelector('.rl').innerHTML=rail(pc);const b=row.querySelector('.rp');b.textContent=(pc>0?'+':'')+pc.toFixed(1)+'%';b.style.color=Math.abs(pc)>3?'var(--kum)':'var(--ok)'});
 const e=+$('#ry').dataset.e||0;}
function runNow(pid,exp){const actual={};document.querySelectorAll('.ri').forEach(e=>actual[e.dataset.i]=e.value);act(()=>api('/runs',{product_id:pid,batches:1,good:$('#rg').value,damaged:$('#rd').value,actual}),'Run saved. Stock updated').then(r=>r&&draw())}
const _rv=rv;rv=function(){_rv();const y=$('#ry');if(!y)return;const ex=+(document.querySelector('.ri')?1:1)&&YE(),pc=(( +$('#rg').value||0)-ex)/ex*100;y.innerHTML=rail(pc);const b=$('#ryp');b.textContent=(pc>0?'+':'')+pc.toFixed(1)+'%';b.style.color=Math.abs(pc)>3?'var(--kum)':'var(--ok)'};
const YE=()=>{const ps=fg().filter(i=>i.bom&&i.bom.length);return (ps.find(i=>i.id==S.runProd)||ps[0]).yield};
function runCard(r){return `<div class="card"><div class="row"><div class="grow"><h3>${r.batch_no} · ${esc(r.product)}</h3><div class="mute">${r.ts.slice(0,16)} · ${r.good} good of ${r.expected} expected · ${r.damaged} pouches damaged</div></div>${r.flags?`<span class="chip bad">${r.flags} flagged</span>`:'<span class="chip ok">Within tolerance</span>'}</div>
 <table style="margin-top:8px">${r.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${l.planned_disp} → <b>${l.actual_disp}</b> ${l.unit}</td><td style="width:150px">${rail(l.var_bp/100)}</td><td class="n" style="color:${l.flag?'var(--kum)':'var(--ok)'}"><b>${l.var_bp>0?'+':''}${(l.var_bp/100).toFixed(1)}%</b></td></tr>`).join('')}<tr><td><b>Yield</b></td><td class="n">${r.expected} → <b>${r.good}</b> packets</td><td>${rail(r.yield_bp/100)}</td><td class="n" style="color:${r.yield_flag?'var(--kum)':'var(--ok)'}"><b>${(r.yield_bp/100).toFixed(1)}%</b></td></tr></table>
 <div class="row" style="margin-top:12px"><div><label>Labour ₹</label><input id="l${r.id}" value="${r.labour/100}" style="width:110px"></div><div><label>Gas / power ₹</label><input id="w${r.id}" value="${r.power/100}" style="width:110px"></div>${['admin','production'].includes(S.user.role)?`<button class="btn ghost sm" onclick="oh(${r.id})">Save overheads</button>`:''}<div class="grow"></div>
 <div class="right"><div class="mute">Materials ${inr(r.mat_cost)} · overheads ${inr(r.labour+r.power)}</div><div class="big">${inr(r.cpp)} <small style="font:600 14px Hanken Grotesk">per packet</small></div><span class="chip ${r.margin>0?'ok':'bad'}">Margin ${inr(r.margin)} (${r.margin_pct.toFixed(0)}%)</span></div></div></div>`}
async function oh(id){const r=await act(()=>api(`/runs/${id}/overheads`,{labour:$('#l'+id).value,power:$('#w'+id).value}),'Overheads saved');if(r)draw()}
async function dl(){const r=await fetch(`/api/report/${S.rep}/csv?from=${S.dates.from}&to=${S.dates.to}`,{headers:{Authorization:'Bearer '+S.token}}),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=S.rep+'.csv';a.click()}
setTimeout(()=>$('#splash')?.remove(),3000);boot();
</script></body></html>
